<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castle of Shadows</title>
<style>
  :root{
    --bg:#05060c; --panel:#0a0e18; --panel2:#0d1322; --line:#1b2740;
    --amber:#ffb347; --amber-d:#8a5c1e; --cyan:#6fe3ff; --violet:#b07cff;
    --green:#7dff9b; --red:#ff5f6d; --dim:#5b6a8a; --txt:#cfe0ff;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Courier New",Courier,monospace;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; -webkit-font-smoothing:none;
  }
  #app{display:flex; gap:10px; padding:10px; height:100%; align-items:stretch}
  #stage{position:relative; display:flex; align-items:center; justify-content:center}
  canvas{
    display:block; background:#03040a; border:2px solid var(--line);
    image-rendering:pixelated; max-width:100%; max-height:100%;
    box-shadow:0 0 0 1px #000, 0 0 40px rgba(111,227,255,.08) inset;
  }
  #panel{
    width:322px; min-width:322px; background:var(--panel); border:2px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden; font-size:12px;
  }
  .ttl{
    padding:7px 9px; background:linear-gradient(90deg,#141c30,#0a0e18);
    border-bottom:1px solid var(--line); letter-spacing:2px; font-size:11px;
    color:var(--amber); text-transform:uppercase;
  }
  #brand{padding:9px; border-bottom:2px solid var(--line); background:#080b14}
  #brand h1{font-size:16px; letter-spacing:3px; color:var(--amber); line-height:1.1}
  #brand small{color:var(--dim); letter-spacing:1px; font-size:10px}
  .scroll{overflow-y:auto; flex:1}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:#1b2740}
  .res{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line)}
  .res div{background:var(--panel2); padding:6px 8px}
  .res b{display:block; font-size:15px; letter-spacing:1px}
  .res span{font-size:9px; color:var(--dim); letter-spacing:1px}
  .oil b{color:var(--amber)} .ess b{color:var(--violet)}
  .cry b{color:var(--cyan)} .core b{color:var(--green)}
  .stats{display:flex; flex-wrap:wrap; gap:6px; padding:7px 9px; border-bottom:1px solid var(--line); font-size:10px; color:var(--dim)}
  .stats i{font-style:normal; color:var(--txt)}
  .shop{padding:6px}
  .item{
    display:flex; gap:7px; align-items:flex-start; width:100%; text-align:left;
    background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    padding:6px; margin-bottom:5px; cursor:pointer; font-family:inherit; font-size:11px;
    transition:background .08s,border-color .08s;
  }
  .item:hover{background:#131b2e; border-color:#2f4468}
  .item.sel{border-color:var(--amber); background:#1a1508; box-shadow:0 0 0 1px var(--amber-d) inset}
  .item.no{opacity:.42; cursor:not-allowed}
  .ico{width:26px; height:26px; min-width:26px; border:1px solid var(--line); background:#05070e; display:flex; align-items:center; justify-content:center; font-size:15px}
  .nm{font-weight:bold; letter-spacing:1px; font-size:11px; display:flex; justify-content:space-between; gap:6px}
  .key{color:var(--dim); font-size:9px; border:1px solid var(--line); padding:0 3px}
  .ds{color:var(--dim); font-size:9.5px; line-height:1.32; margin-top:2px}
  .cost{margin-top:3px; font-size:10px; letter-spacing:.5px}
  .c-oil{color:var(--amber)} .c-ess{color:var(--violet)} .c-cry{color:var(--cyan)} .c-up{color:var(--dim)}
  .abil{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; padding:6px}
  .ab{position:relative; overflow:hidden; background:var(--panel2); border:1px solid var(--line); color:var(--txt); font-family:inherit; font-size:9px; padding:5px 3px; cursor:pointer; letter-spacing:.5px}
  .ab:hover{border-color:#2f4468}
  .ab .abn{font-size:14px}
  .ab .cd{position:absolute; left:0; bottom:0; width:100%; background:rgba(0,0,0,.72); pointer-events:none}
  .ab.rdy{border-color:var(--cyan); color:var(--cyan)}
  .foot{padding:6px 9px; border-top:1px solid var(--line); background:#080b14; display:flex; gap:6px}
  .btn{flex:1; background:#131b2e; border:1px solid var(--line); color:var(--txt); font-family:inherit; font-size:10.5px; padding:6px; cursor:pointer; letter-spacing:1px}
  .btn:hover{border-color:var(--amber); color:var(--amber)}
  .btn.go{border-color:var(--green); color:var(--green)}
  #log{height:74px; overflow:hidden; padding:5px 9px; font-size:9.5px; color:var(--dim); line-height:1.45; border-top:1px solid var(--line); background:#070911}
  #log b{color:var(--amber); font-weight:normal}
  #sel{padding:7px 9px; border-top:1px solid var(--line); background:#070911; font-size:10px; min-height:44px; color:var(--dim); line-height:1.4}
  #sel b{color:var(--cyan)}
  #ov{
    position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(3,4,10,.9); text-align:center; letter-spacing:2px; gap:12px;
  }
  #ov.on{display:flex}
  #ov h2{font-size:30px; color:var(--red); letter-spacing:6px}
  #ov p{color:var(--dim); font-size:12px; line-height:1.7}
  #ov button{background:#131b2e; border:1px solid var(--amber); color:var(--amber); font-family:inherit; font-size:13px; padding:9px 22px; cursor:pointer; letter-spacing:2px}
  @media (max-width:1180px){ #panel{width:280px;min-width:280px} }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="800" height="680"></canvas>
    <div id="ov"><h2 id="ovt">EL CASTILLO HA CAÍDO</h2><p id="ovp"></p><button id="ovb">REINICIAR</button></div>
  </div>
  <div id="panel">
    <div id="brand">
      <h1>CASTLE OF SHADOWS</h1>
      <small>DEFENSA DE LUZ Y PENUMBRA</small>
    </div>
    <div class="res">
      <div class="oil"><b id="r-oil">0</b><span>ACEITE DE FAROL <i id="r-oilrate"></i></span></div>
      <div class="ess"><b id="r-ess">0</b><span>ESENCIA DE PENUMBRA</span></div>
      <div class="cry"><b id="r-cry">0</b><span>CRISTALES DE PRISMA</span></div>
      <div class="core"><b id="r-core">20</b><span>NÚCLEO DEL CASTILLO</span></div>
    </div>
    <div class="stats">
      <span>OLEADA <i id="s-wave">0</i></span>
      <span>ENEMIGOS <i id="s-en">0</i></span>
      <span>BAJAS <i id="s-kill">0</i></span>
      <span>FASE <i id="s-ph">PREP</i></span>
      <span>CURSOR <i id="s-lz">-</i></span>
    </div>
    <div class="ttl">Habilidades activas</div>
    <div class="abil">
      <button class="ab" id="ab0"><div class="abn">🌑</div>ECLIPSE<br><span>Q</span><div class="cd" id="cd0"></div></button>
      <button class="ab" id="ab1"><div class="abn">💥</div>SUPERNOVA<br><span>W</span><div class="cd" id="cd1"></div></button>
      <button class="ab" id="ab2"><div class="abn">🔷</div>ENFOQUE<br><span>E</span><div class="cd" id="cd2"></div></button>
    </div>
    <div class="ttl">Tienda de defensas</div>
    <div class="scroll"><div class="shop" id="shop"></div></div>
    <div id="sel">Selecciona una defensa o haz clic en una estructura del mapa.</div>
    <div id="log"></div>
    <div class="foot">
      <button class="btn go" id="bnext">▶ OLEADA</button>
      <button class="btn" id="bsell">VENDER</button>
      <button class="btn" id="bpause">PAUSA</button>
    </div>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   CASTLE OF SHADOWS  —  Defensa de base (Canvas 2D, un archivo)
   ============================================================ */

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const CELL = 40, COLS = W/CELL, ROWS = H/CELL;
const CORE = { x: 400, y: 340, r: 26 };
const MOON = { x: 400, y: 340, r: 12 };

const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const dist  = (a,b,c,d)=> Math.hypot(a-c,b-d);
const rnd   = (a,b)=> a+Math.random()*(b-a);
const pick  = a => a[(Math.random()*a.length)|0];
function angDiff(a,b){ let d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }

/* ---------------- Camino de los invasores (espiral hacia el núcleo) ------ */
const PATH = [
  {x:-30,y:60},{x:740,y:60},{x:740,y:620},{x:60,y:620},{x:60,y:180},
  {x:620,y:180},{x:620,y:500},{x:180,y:500},{x:180,y:300},{x:500,y:300},
  {x:500,y:400},{x:400,y:400},{x:CORE.x,y:CORE.y}
];
function distToPath(x,y){
  let m = 1e9;
  for(let i=0;i<PATH.length-1;i++){
    const a=PATH[i], b=PATH[i+1];
    const vx=b.x-a.x, vy=b.y-a.y, L2=vx*vx+vy*vy;
    let t = L2 ? ((x-a.x)*vx+(y-a.y)*vy)/L2 : 0; t=clamp(t,0,1);
    const d = Math.hypot(x-(a.x+vx*t), y-(a.y+vy*t));
    if(d<m) m=d;
  }
  return m;
}

/* ---------------- Catálogo de defensas ---------------------------------- */
const TOWERS = {
  torch: { key:'1', name:'ANTORCHA DE ACEITE', icon:'🔥', cost:{oil:25}, oilUse:0.40, hp:70,
    ds:'Revela invisibles y proyecta luz cálida. Lanza gotas ardientes. Consume aceite/s.',
    light:118, range:130, dmg:7, rate:1.15, mech:true, lightSource:true },
  candle:{ key:'2', name:'CANDIL DE REFRACCIÓN', icon:'🕯', cost:{oil:10}, oilUse:0.15, hp:45,
    ds:'Muro de candiles. Clic para encender/apagar y remodelar el mapa a voluntad.',
    light:84, range:0, dmg:0, rate:0, mech:true, lightSource:true, toggle:true },
  beacon:{ key:'3', name:'FARO SOLAR CONCENTRADO', icon:'🔦', cost:{oil:70}, oilUse:1.10, hp:90,
    ds:'Haz direccional continuo. Paraliza a los enemigos oscuros y se refracta en los espejos.',
    light:60, range:320, dmg:30, rate:0, mech:true, lightSource:true },
  gargoyle:{ key:'4', name:'GÁRGOLA DE PIEDRA', icon:'🗿', cost:{oil:50}, oilUse:0, hp:999,
    ds:'En la luz: estatua invulnerable que frena el paso. En la oscuridad: despierta y devora.',
    light:0, range:76, dmg:34, rate:0.55, mech:false },
  mirror:{ key:'5', name:'ESPEJO PRISMÁTICO', icon:'🔷', cost:{oil:20,cry:1}, oilUse:0, hp:80,
    ds:'Clic para girarlo 20°. Divide cada haz de luz que recibe en dos direcciones.',
    light:34, range:0, dmg:0, rate:0, mech:true, lightSource:true },
  trap:{ key:'6', name:'TRAMPA DE PENUMBRA', icon:'💣', cost:{ess:30}, oilUse:0, hp:1,
    ds:'Oculta hasta que un enemigo iluminado entra en sombra sobre ella: explosión en cadena.',
    light:0, range:0, dmg:80, rate:0, mech:false },
  knight:{ key:'7', name:'CABALLERO DE SOMBRA', icon:'⚔', cost:{ess:55}, oilUse:0, hp:150,
    ds:'Unidad móvil. Patrulla las zonas oscuras. Débil en la luz, letal durante un eclipse.',
    light:0, range:92, dmg:16, rate:0.5, mech:false, unit:true }
};
const FORGE = {
  lens:  { key:'8', name:'LENTE MAYOR (FORJA)', icon:'🔮', cost:{cry:2}, cap:5,
    ds:'Forja cristales en lentes: +18% de alcance para todas las fuentes de luz.' },
  refin: { key:'9', name:'REFINERÍA DE ACEITE', icon:'🛢', cost:{cry:2,oil:40}, cap:5,
    ds:'Mejora el destilado del castillo: +0.7 de aceite por segundo, permanente.' }
};

/* ---------------- Enemigos ---------------------------------------------- */
const ENEMIES = {
  moth:  { name:'Cazador de Luz',  hp:46,  spd:78, dmg:1, col:'#ffd479', r:9,  bounty:{oil:3},  dark:false },
  wraith:{ name:'Sombra Errante',  hp:60,  spd:96, dmg:1, col:'#b07cff', r:9,  bounty:{ess:3},  dark:true },
  golem: { name:'Golem de Umbría', hp:230, spd:34, dmg:2, col:'#7f8ba8', r:15, bounty:{ess:4,oil:4}, dark:true },
  boss:  { name:'EL DEVORADOR DE LUZ', hp:1100, spd:26, dmg:6, col:'#ff5f6d', r:30, bounty:{cry:3,ess:40,oil:60}, dark:true }
};

/* ---------------- Estado global ----------------------------------------- */
let G;
function newGame(){
  G = {
    oil:120, ess:40, cry:1, core:20, wave:0, kills:0,
    phase:'prep', prep:9, spawnQ:[], spawnT:0,
    towers:[], units:[], enemies:[], shots:[], fx:[], beams:[],
    build:null, sel:null, paused:false, over:false, won:false,
    t:0, moonA:0, moonB:0, eclipse:0, nova:0, focus:0,
    lens:0, refin:0, oilRate:0, msg:[],
    abil:[{cd:0,max:45},{cd:0,max:30},{cd:0,max:20}],
    mouse:{x:-99,y:-99,cx:-1,cy:-1}, shake:0, banner:0, bannerTxt:''
  };
  buildGrid();
  log('El castillo despierta. La luna artificial gira sobre el núcleo.');
  log('Construye <b>antorchas</b> para ver, y mata en la sombra para <b>esencia</b>.');
}

/* Celdas construibles */
let GRID;
function buildGrid(){
  GRID = [];
  for(let cy=0; cy<ROWS; cy++){
    GRID[cy]=[];
    for(let cx=0; cx<COLS; cx++){
      const x=cx*CELL+CELL/2, y=cy*CELL+CELL/2;
      const okPath = distToPath(x,y) > 34;
      const okCore = dist(x,y,CORE.x,CORE.y) > 58;
      GRID[cy][cx] = (okPath && okCore) ? 0 : 1; // 0 libre, 1 bloqueado, 2 ocupado
    }
  }
}
function cellFree(cx,cy){ return cx>=0&&cy>=0&&cx<COLS&&cy<ROWS&&GRID[cy][cx]===0; }

/* ---------------- Modelo de luz ----------------------------------------- */
const LIT = 0.60, DUSK = 0.22;   // umbrales luz / penumbra / oscuridad
function lensMul(){ return 1 + G.lens*0.18; }

function moonLight(x,y){
  if(G.eclipse>0) return 0;
  const d = dist(x,y,MOON.x,MOON.y);
  let base = clamp(1.14 - d/(400*lensMul()), 0, 1) * 0.92;
  if(base<=0) return 0;
  const a = Math.atan2(y-MOON.y, x-MOON.x);
  base *= wedge(a, G.moonA, 0.62, 0.30);
  base *= wedge(a, G.moonB, 0.40, 0.22);
  return base;
}
function wedge(a, c, half, soft){
  const d = Math.abs(angDiff(a,c));
  if(d < half) return 0;
  if(d < half+soft) return (d-half)/soft;
  return 1;
}

/* Fuentes puntuales activas (recalculadas cada frame) */
let SRC = [];
function refreshSources(){
  SRC.length = 0;
  if(G.eclipse>0) return;
  for(const t of G.towers){
    if(!t.def.lightSource || t.dead) continue;
    if(t.off || t.doused>0 || t.disabled) continue;
    if(t.type==='torch' && G.oil<=0) continue;
    if(t.type==='candle'&& G.oil<=0) continue;
    SRC.push({x:t.x, y:t.y, r:t.def.light*lensMul(), p:t.type==='torch'?1.35:1.15, o:t});
  }
}
function lightAt(x,y,exc){
  if(G.nova>0) return 1;
  if(G.eclipse>0) return 0.015;
  let l = moonLight(x,y);
  for(let i=0;i<SRC.length;i++){
    const s=SRC[i]; if(s.o===exc) continue;
    const dx=x-s.x, dy=y-s.y; const d2=dx*dx+dy*dy;
    if(d2 > s.r*s.r) continue;
    l += (1 - Math.sqrt(d2)/s.r) * s.p;
    if(l>=1) return darken(x,y,1);
  }
  for(let i=0;i<G.beams.length;i++){
    const b=G.beams[i];
    if(segDist(x,y,b.x1,b.y1,b.x2,b.y2) < 30) l += 0.85;
  }
  return darken(x,y,clamp(l,0,1));
}
/* El aura del Devorador apaga la luz a su alrededor */
function darken(x,y,l){
  for(let i=0;i<G.enemies.length;i++){
    const e=G.enemies[i];
    if(e.type!=='boss'||e.dead) continue;
    const d = dist(x,y,e.x,e.y);
    if(d < e.aura) l *= clamp(d/e.aura,0,1)*0.85;
  }
  return l;
}
function segDist(px,py,x1,y1,x2,y2){
  const vx=x2-x1, vy=y2-y1, L2=vx*vx+vy*vy;
  let t = L2 ? ((px-x1)*vx+(py-y1)*vy)/L2 : 0; t=clamp(t,0,1);
  return Math.hypot(px-(x1+vx*t), py-(y1+vy*t));
}
function zoneOf(l){ return l>=LIT ? 'LUZ' : (l>=DUSK ? 'PENUMBRA' : 'OSCURIDAD'); }

/* ============================ TORRES ==================================== */
function placeTower(type,cx,cy){
  const def = TOWERS[type];
  if(!def) return false;
  if(def.unit){ // caballero de sombra: unidad libre
    if(!pay(def.cost)) { log('Recursos insuficientes.'); return false; }
    G.units.push({ type:'knight', def, x:cx*CELL+CELL/2, y:cy*CELL+CELL/2,
      hx:cx*CELL+CELL/2, hy:cy*CELL+CELL/2, hp:def.hp, mhp:def.hp, cd:0, ang:0, tgt:null });
    log('Un <b>Caballero de Sombra</b> se alza de la penumbra.');
    return true;
  }
  if(!cellFree(cx,cy)){ log('No se puede construir ahí.'); return false; }
  if(!pay(def.cost)){ log('Recursos insuficientes.'); return false; }
  GRID[cy][cx]=2;
  const t = { type, def, cx, cy, x:cx*CELL+CELL/2, y:cy*CELL+CELL/2,
    hp:def.hp, mhp:def.hp, cd:0, ang:-Math.PI/2, off:false, doused:0,
    disabled:false, zone:'LUZ', dead:false, flash:0, spent:cost0(def.cost) };
  G.towers.push(t);
  fxRing(t.x,t.y,34,'#ffb347');
  return true;
}
function cost0(c){ return {oil:c.oil||0, ess:c.ess||0, cry:c.cry||0}; }
function canPay(c){ return G.oil>=(c.oil||0) && G.ess>=(c.ess||0) && G.cry>=(c.cry||0); }
function pay(c){ if(!canPay(c)) return false; G.oil-=c.oil||0; G.ess-=c.ess||0; G.cry-=c.cry||0; return true; }

function updateTowers(dt){
  let use = 0;
  for(const t of G.towers){
    if(t.dead) continue;
    if(t.doused>0) t.doused-=dt;
    if(t.flash>0) t.flash-=dt;
    const l = lightAt(t.x,t.y,t);
    t.zone = zoneOf(l);
    const lightsDead = G.oil<=0.001;
    t.disabled = t.def.mech && (t.zone==='OSCURIDAD' || t.doused>0 || (t.def.oilUse>0 && lightsDead) || G.eclipse>0);
    if(t.def.oilUse>0 && !t.off && !t.disabled && !lightsDead) use += t.def.oilUse;
    if(t.def.mech && (t.off || t.disabled)) { if(t.type!=='trap') { t.cd=0; } }

    switch(t.type){
      case 'torch':  if(!t.disabled && !t.off) torchFire(t,dt,l); break;
      case 'beacon': if(!t.disabled && !t.off) beaconAim(t,dt); break;
      case 'gargoyle': gargoyle(t,dt,l); break;
      case 'trap':   trapCheck(t); break;
    }
  }
  G.oilRate = -use + 1.6 + G.refin*0.7;
  G.oil = clamp(G.oil + G.oilRate*dt, 0, 999);
  if(G.oil<=0 && !G.dark0){ G.dark0=true; log('<b>¡Sin aceite!</b> El castillo cae en la penumbra total.'); }
  if(G.oil>2) G.dark0=false;
}
function rateMul(t){ return t.zone==='LUZ' ? 2 : 1; }         // +100% en la luz
function accuracy(t){ return t.zone==='LUZ' ? 1 : 0.62; }      // +100% precisión en la luz

function torchFire(t,dt,l){
  t.cd -= dt;
  if(t.cd>0) return;
  const e = nearestEnemy(t.x,t.y,t.def.range);
  if(!e) return;
  t.cd = 1/(t.def.rate*rateMul(t));
  const spread = (1-accuracy(t))*0.34;
  const a = Math.atan2(e.y-t.y, e.x-t.x) + rnd(-spread,spread);
  G.shots.push({x:t.x,y:t.y,vx:Math.cos(a)*330,vy:Math.sin(a)*330,dmg:t.def.dmg*(t.zone==='LUZ'?1.5:1),life:1.2,col:'#ffb347'});
  t.flash = 0.09;
}
function beaconAim(t,dt){
  const e = nearestEnemy(t.x,t.y,t.def.range+40);
  if(e){
    const want = Math.atan2(e.y-t.y, e.x-t.x);
    const d = angDiff(want,t.ang);
    t.ang += clamp(d,-2.2*dt,2.2*dt);
  } else t.ang += 0.35*dt;
}

/* Haces de luz: los faros emiten, los espejos dividen en dos */
function computeBeams(){
  G.beams.length = 0;
  for(const t of G.towers){
    if(t.type!=='beacon'||t.dead||t.disabled||t.off) continue;
    castBeam(t.x,t.y,t.ang,t.def.range*lensMul(),t.def.dmg*rateMul(t)*0.6,0,null);
  }
}
function castBeam(x,y,a,len,dmg,depth,fromM){
  const dx=Math.cos(a), dy=Math.sin(a);
  let end = len, hit = null;
  if(depth<2){
    for(const m of G.towers){
      if(m.type!=='mirror'||m.dead||m===fromM) continue;
      const rel = (m.x-x)*dx + (m.y-y)*dy;
      if(rel<12||rel>end) continue;
      if(Math.hypot(m.x-(x+dx*rel), m.y-(y+dy*rel)) < 20){ end=rel; hit=m; }
    }
  }
  const x2 = x+dx*end, y2 = y+dy*end;
  G.beams.push({x1:x,y1:y,x2,y2,dmg});
  if(hit){
    fxSpark(hit.x,hit.y,'#6fe3ff',2);
    castBeam(hit.x,hit.y,hit.ang+0.42,len*0.75,dmg*0.62,depth+1,hit);
    castBeam(hit.x,hit.y,hit.ang-0.42,len*0.75,dmg*0.62,depth+1,hit);
  }
}
function beamDamage(dt){
  for(const b of G.beams){
    for(const e of G.enemies){
      if(e.dead) continue;
      if(segDist(e.x,e.y,b.x1,b.y1,b.x2,b.y2) < e.r+9){
        hurt(e, b.dmg*dt, 'beam');
        if(e.dark) e.stun = Math.max(e.stun, 0.45);   // paraliza a los oscuros
        if(Math.random()<0.25) fxSpark(e.x,e.y,'#dff6ff',1);
      }
    }
  }
}

/* Gárgola: estatua en la luz, devoradora en la oscuridad */
function gargoyle(t,dt,l){
  t.awake = (l < DUSK) || G.eclipse>0;
  t.dozing = !t.awake && l < LIT;
  if(!t.awake){
    for(const e of G.enemies){ if(!e.dead && dist(e.x,e.y,t.x,t.y)<62) e.slow=Math.max(e.slow,0.55); }
    t.gx=t.x; t.gy=t.y; return;
  }
  t.cd -= dt;
  const e = nearestEnemy(t.x,t.y,t.def.range+30);
  if(e){
    t.ang = Math.atan2(e.y-t.y,e.x-t.x);
    const d = dist(e.x,e.y,t.x,t.y);
    t.gx = lerp(t.gx||t.x, t.x+Math.cos(t.ang)*Math.min(20,d*0.4), 0.12);
    t.gy = lerp(t.gy||t.y, t.y+Math.sin(t.ang)*Math.min(20,d*0.4), 0.12);
    if(t.cd<=0 && d < t.def.range){
      t.cd = t.def.rate;
      hurt(e, t.def.dmg*(G.eclipse>0?1.6:1), 'melee');
      fxSpark(e.x,e.y,'#b07cff',5); t.flash=0.12; G.shake=Math.max(G.shake,2);
    }
  } else { t.gx=lerp(t.gx||t.x,t.x,0.1); t.gy=lerp(t.gy||t.y,t.y,0.1); }
}

/* Trampa de penumbra: se dispara cuando un enemigo iluminado entra en sombra */
function trapCheck(t){
  if(t.dead) return;
  for(const e of G.enemies){
    if(e.dead) continue;
    if(dist(e.x,e.y,t.x,t.y) > 26) continue;
    if(e.litMem>0 && lightAt(e.x,e.y) < LIT){ trapBoom(t,0); return; }
  }
}
function trapBoom(t,chain){
  if(t.dead) return;
  t.dead = true; GRID[t.cy][t.cx]=0;
  const crit = zoneOf(lightAt(t.x,t.y,t))==='PENUMBRA';
  const dmg = t.def.dmg * (crit?2:1);
  fxRing(t.x,t.y,96,crit?'#ff5f6d':'#b07cff'); G.shake=Math.max(G.shake,crit?7:4);
  for(const e of G.enemies){ if(!e.dead && dist(e.x,e.y,t.x,t.y)<96) hurt(e,dmg,'trap'); }
  if(chain<4){
    for(const o of G.towers){
      if(o!==t && o.type==='trap' && !o.dead && dist(o.x,o.y,t.x,t.y)<140){
        setTimeout(()=>{ if(!G.over) trapBoom(o,chain+1); }, 130);
      }
    }
  }
}

/* Caballero de sombra */
function updateUnits(dt){
  for(const u of G.units){
    if(u.hp<=0) continue;
    const l = lightAt(u.x,u.y);
    const dark = l < DUSK || G.eclipse>0;
    const pow  = G.eclipse>0 ? 2 : (dark ? 1 : 0.35);
    const spd  = (dark?92:56);
    if(dark) u.hp = Math.min(u.mhp, u.hp + 9*dt);
    const e = nearestEnemy(u.x,u.y,300);
    if(e){
      const d = dist(u.x,u.y,e.x,e.y);
      u.ang = Math.atan2(e.y-u.y,e.x-u.x);
      if(d > u.def.range*0.7){ u.x += Math.cos(u.ang)*spd*dt; u.y += Math.sin(u.ang)*spd*dt; }
      u.cd -= dt;
      if(u.cd<=0 && d < u.def.range){
        u.cd = u.def.rate; hurt(e, u.def.dmg*pow, 'melee'); fxSpark(e.x,e.y,'#8f6bff',3);
      }
    } else {
      const d = dist(u.x,u.y,u.hx,u.hy);
      if(d>10){ const a=Math.atan2(u.hy-u.y,u.hx-u.x); u.x+=Math.cos(a)*spd*0.6*dt; u.y+=Math.sin(a)*spd*0.6*dt; }
    }
    u.x=clamp(u.x,10,W-10); u.y=clamp(u.y,10,H-10);
  }
  G.units = G.units.filter(u=>u.hp>0);
}

/* ============================ ENEMIGOS ================================== */
function spawn(type,scale){
  const d = ENEMIES[type];
  const e = {
    type, def:d, x:PATH[0].x, y:PATH[0].y, seg:0, st:0,
    hp:d.hp*scale, mhp:d.hp*scale, spd:d.spd, r:d.r, dark:d.dark,
    dead:false, slow:0, stun:0, litMem:0, hurtT:0, burn:0,
    aura: type==='boss'?165:0, mode:'path', tgt:null
  };
  G.enemies.push(e);
}
function updateEnemies(dt){
  for(const e of G.enemies){
    if(e.dead) continue;
    const l = lightAt(e.x,e.y);
    e.lit = l >= 0.42;
    e.litMem = e.lit ? 2.4 : Math.max(0, e.litMem-dt);
    if(e.hurtT>0) e.hurtT-=dt;
    if(e.burn>0){ e.burn-=dt; hurt(e, 24*dt, 'burn'); }
    if(e.stun>0){ e.stun-=dt; e.slow=0; continue; }

    let spd = e.spd * (e.slow?1-e.slow:1);
    e.slow = 0;

    if(e.type==='boss'){
      for(const t of G.towers){
        if(t.def.lightSource && !t.dead && dist(t.x,t.y,e.x,e.y)<e.aura){
          t.doused = 1.4; t.hp -= 16*dt;
          if(t.hp<=0) killTower(t,'devorada por la oscuridad');
        }
      }
    }
    if(e.type==='moth'){
      const t = nearestLight(e.x,e.y);
      if(t){
        e.mode='hunt'; e.tgt=t;
        const a = Math.atan2(t.y-e.y,t.x-e.x);
        const d = dist(e.x,e.y,t.x,t.y);
        if(d>16){ e.x+=Math.cos(a)*spd*dt; e.y+=Math.sin(a)*spd*dt; }
        else { t.hp -= 20*dt; t.flash=0.1; if(t.hp<=0) killTower(t,'consumida por las polillas'); }
        continue;
      } else e.mode='path';
    }
    /* avance por el camino */
    const a0=PATH[e.seg], a1=PATH[e.seg+1];
    if(!a1){ reachCore(e); continue; }
    const segLen = dist(a0.x,a0.y,a1.x,a1.y);
    e.st += spd*dt/segLen;
    while(e.st>=1){ e.st-=1; e.seg++; if(!PATH[e.seg+1]){ reachCore(e); break; } }
    if(e.dead) continue;
    const b0=PATH[e.seg], b1=PATH[e.seg+1];
    if(b1){ e.x = lerp(b0.x,b1.x,e.st); e.y = lerp(b0.y,b1.y,e.st); }
  }
  G.enemies = G.enemies.filter(e=>!e.dead);
}
function reachCore(e){
  e.dead = true;
  if(e.type==='boss'){
    G.oil = 0; G.core -= e.def.dmg;
    log('<b>El Devorador alcanzó el núcleo</b> y absorbió toda tu reserva de aceite.');
    fxRing(CORE.x,CORE.y,220,'#ff5f6d'); G.shake=18;
  } else { G.core -= e.def.dmg; fxRing(CORE.x,CORE.y,60,'#ff5f6d'); G.shake=6; }
  if(G.core<=0) endGame(false);
}
function hurt(e,d,src){
  if(e.dead) return;
  if(e.type==='wraith' && !e.lit && src!=='trap'){ if(Math.random()<0.08) fxSpark(e.x,e.y,'#3a2e5e',1); return; }
  if(e.type==='golem' && lightAt(e.x,e.y) < DUSK && src!=='trap') d *= 0.18;
  e.hp -= d; e.hurtT = 0.1;
  if(e.hp<=0) kill(e);
}
function kill(e){
  if(e.dead) return;
  e.dead = true; G.kills++;
  const l = lightAt(e.x,e.y), b = e.def.bounty;
  if(l < DUSK){ G.ess += b.ess || 3; fxText(e.x,e.y,'+'+(b.ess||3)+' ESENCIA','#b07cff'); }
  else        { G.oil += b.oil || 3; fxText(e.x,e.y,'+'+(b.oil||3)+' ACEITE','#ffb347'); }
  if(e.type==='boss'){
    G.cry += b.cry; G.ess += b.ess; G.oil += b.oil;
    fxText(e.x,e.y-26,'+'+b.cry+' CRISTALES DE PRISMA','#6fe3ff');
    fxRing(e.x,e.y,180,'#6fe3ff'); G.shake=14;
    log('<b>El Devorador de Luz ha caído.</b> Cristales de Prisma recuperados.');
  }
  fxSpark(e.x,e.y,e.def.col,8);
}
function killTower(t,why){
  t.dead = true; if(t.cx!=null) GRID[t.cy][t.cx]=0;
  if(G.sel===t) G.sel=null;
  fxRing(t.x,t.y,44,'#ff5f6d');
  log('<b>'+t.def.name+'</b> '+why+'.');
}
function nearestEnemy(x,y,r){
  let best=null, bd=r;
  for(const e of G.enemies){
    if(e.dead) continue;
    const d = dist(x,y,e.x,e.y)-e.r;
    if(d<bd){ bd=d; best=e; }
  }
  return best;
}
function nearestLight(x,y){
  let best=null, bd=1e9;
  for(const t of G.towers){
    if(t.dead || !t.def.lightSource || t.off || t.doused>0) continue;
    if(t.type==='mirror') continue;
    const d = dist(x,y,t.x,t.y);
    if(d<bd){ bd=d; best=t; }
  }
  return best;
}

/* ============================ PROYECTILES / FX ========================== */
function updateShots(dt){
  for(const s of G.shots){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    if(s.life<=0){ s.done=true; continue; }
    for(const e of G.enemies){
      if(e.dead) continue;
      if(dist(s.x,s.y,e.x,e.y) < e.r+5){ hurt(e,s.dmg,'shot'); fxSpark(s.x,s.y,s.col,2); s.done=true; break; }
    }
  }
  G.shots = G.shots.filter(s=>!s.done);
}
function fxRing(x,y,r,col){ G.fx.push({k:'ring',x,y,r,t:0,life:0.5,col}); }
function fxSpark(x,y,col,n){ for(let i=0;i<n;i++){ const a=rnd(0,6.28),v=rnd(30,150); G.fx.push({k:'p',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:rnd(0.25,0.6),col}); } }
function fxText(x,y,s,col){ G.fx.push({k:'t',x,y,s,t:0,life:1.1,col}); }
function updateFx(dt){
  for(const f of G.fx){ f.t+=dt; if(f.k==='p'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=0.94; f.vy*=0.94; } if(f.k==='t') f.y-=22*dt; }
  G.fx = G.fx.filter(f=>f.t<f.life);
}

/* ============================ OLEADAS =================================== */
function waveComp(n){
  const q=[]; const boss = n%5===0;
  const scale = 1 + (n-1)*0.16;
  if(boss){
    for(let i=0;i<6+n;i++) q.push({t:pick(['moth','wraith','golem']), d:0.65});
    q.push({t:'boss', d:2.2});
    for(let i=0;i<4+((n/5)|0)*2;i++) q.push({t:pick(['wraith','golem']), d:1.1});
  } else {
    const moths  = 3 + Math.round(n*1.2);
    const wraith = n>=2 ? 2 + Math.round(n*0.9) : 0;
    const golems = n>=3 ? 1 + Math.floor(n/2) : 0;
    for(let i=0;i<moths;i++)  q.push({t:'moth',  d:rnd(0.5,0.9)});
    for(let i=0;i<wraith;i++) q.push({t:'wraith',d:rnd(0.5,1.0)});
    for(let i=0;i<golems;i++) q.push({t:'golem', d:rnd(1.0,1.6)});
    for(let i=q.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [q[i],q[j]]=[q[j],q[i]]; }
  }
  return {q, scale};
}
function startWave(){
  if(G.phase==='wave') return;
  const early = Math.max(0, Math.round(G.prep));
  if(early>0 && G.wave>0){ G.oil += early*2; fxText(CORE.x,CORE.y-40,'+'+(early*2)+' ACEITE (PRISA)','#ffb347'); }
  G.wave++;
  const w = waveComp(G.wave);
  G.spawnQ = w.q; G.waveScale = w.scale; G.spawnT = 0.4; G.phase='wave';
  const boss = G.wave%5===0;
  G.banner = 2.4; G.bannerTxt = boss ? 'OLEADA '+G.wave+' — EL DEVORADOR DE LUZ' : 'OLEADA '+G.wave;
  log(boss ? '<b>¡JEFE!</b> El Devorador de Luz se acerca. Apagará cada antorcha a su paso.'
           : 'Oleada <b>'+G.wave+'</b> en marcha.');
}
function updateWave(dt){
  if(G.phase==='prep'){
    G.prep -= dt;
    if(G.prep<=0) startWave();
    return;
  }
  if(G.spawnQ.length){
    G.spawnT -= dt;
    if(G.spawnT<=0){ const s=G.spawnQ.shift(); spawn(s.t, G.waveScale); G.spawnT = s.d; }
    return;
  }
  if(G.enemies.length===0){
    const bonus = 26 + G.wave*7;
    G.oil += bonus;
    log('Oleada '+G.wave+' repelida. <b>+'+bonus+' aceite</b> destilado.');
    fxText(CORE.x,CORE.y-40,'+'+bonus+' ACEITE','#ffb347');
    if(G.wave>=20){ endGame(true); return; }
    G.phase='prep'; G.prep = 12;
  }
}

/* ============================ HABILIDADES =============================== */
function useAbility(i){
  const a = G.abil[i];
  if(a.cd>0 || G.over) return;
  if(i===0){
    G.eclipse = 6; a.cd = a.max;
    log('<b>ECLIPSE TEMPORAL</b>: toda luz se apaga. Las gárgolas despiertan.');
    G.shake=8; fxRing(CORE.x,CORE.y,420,'#b07cff');
  } else if(i===1){
    if(G.oil<20){ log('Necesitas 20 de aceite para la Supernova.'); return; }
    G.oil -= 20; G.nova = 3; a.cd = a.max;
    for(const e of G.enemies) e.burn = 3;
    log('<b>SUPERNOVA DE ACEITE</b>: una luz cegadora quema a los invasores.');
    G.shake=12; fxRing(CORE.x,CORE.y,520,'#ffe9b0');
  } else {
    const mx=G.mouse.x, my=G.mouse.y;
    let n=0;
    for(const t of G.towers){
      if(t.type==='mirror'&&!t.dead){ t.ang = Math.atan2(my-t.y,mx-t.x); n++; fxSpark(t.x,t.y,'#6fe3ff',4); }
      if(t.type==='beacon'&&!t.dead){ t.ang = Math.atan2(my-t.y,mx-t.x); n++; }
    }
    a.cd = a.max; fxRing(mx,my,120,'#6fe3ff');
    log('<b>ENFOQUE PRISMÁTICO</b>: '+n+' fuentes alineadas hacia el cursor.');
  }
}

/* ============================ RENDER ==================================== */
const LS = 20, LW = Math.ceil(W/LS)+1, LH = Math.ceil(H/LS)+1;
const lcv = document.createElement('canvas'); lcv.width=LW; lcv.height=LH;
const lctx = lcv.getContext('2d');
const limg = lctx.createImageData(LW,LH);

function drawDarkness(){
  const d = limg.data;
  for(let y=0;y<LH;y++){
    for(let x=0;x<LW;x++){
      const l = lightAt(x*LS, y*LS);
      const a = Math.pow(1-clamp(l,0,1), 0.78) * 250;
      const i = (y*LW+x)*4;
      d[i]=3; d[i+1]=4; d[i+2]=12; d[i+3]=a;
    }
  }
  lctx.putImageData(limg,0,0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(lcv, 0,0, W,H);
}
function drawGround(){
  ctx.fillStyle='#0a0f1d'; ctx.fillRect(0,0,W,H);
  // losas del patio: las casillas construibles se ven como piedra tallada
  for(let cy=0;cy<ROWS;cy++){
    for(let cx=0;cx<COLS;cx++){
      if(GRID[cy][cx]===1) continue;
      const x=cx*CELL, y=cy*CELL;
      ctx.fillStyle = ((cx+cy)&1) ? '#141d33' : '#111828';
      ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
      ctx.strokeStyle='rgba(70,98,150,.10)'; ctx.lineWidth=1;
      ctx.strokeRect(x+1.5,y+1.5,CELL-3,CELL-3);
    }
  }
  // camino de los invasores
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle='#080c16'; ctx.lineWidth=44; ctx.beginPath();
  ctx.moveTo(PATH[0].x,PATH[0].y); for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x,PATH[i].y); ctx.stroke();
  ctx.strokeStyle='#1d2947'; ctx.lineWidth=38; ctx.beginPath();
  ctx.moveTo(PATH[0].x,PATH[0].y); for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x,PATH[i].y); ctx.stroke();
  ctx.strokeStyle='rgba(176,124,255,.30)'; ctx.lineWidth=2; ctx.setLineDash([6,12]);
  ctx.lineDashOffset = -G.t*22;
  ctx.beginPath(); ctx.moveTo(PATH[0].x,PATH[0].y); for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x,PATH[i].y); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset=0;
}

function drawPathHint(){

  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle='rgba(120,150,220,.16)'; ctx.lineWidth=38;

function drawCore(){
  const p = 1+Math.sin(G.t*2)*0.05;
  ctx.save(); ctx.translate(CORE.x,CORE.y);
  // almenas del torreón
  ctx.strokeStyle='rgba(125,255,155,.55)'; ctx.lineWidth=2;

  }
  ctx.save(); ctx.rotate(-G.t*0.4);
  ctx.strokeStyle='rgba(125,255,155,.28)'; ctx.strokeRect(-15,-15,30,30);
  ctx.restore();
  ctx.restore();
}
function drawMoon(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const g = ctx.createRadialGradient(MOON.x,MOON.y,2,MOON.x,MOON.y,110*lensMul());
  const pw = G.eclipse>0?0.02:0.20;
  g.addColorStop(0,'rgba(210,230,255,'+pw+')'); g.addColorStop(1,'rgba(120,160,255,0)');
  ctx.fillStyle=g; ctx.fillRect(MOON.x-200,MOON.y-200,400,400);
  ctx.restore();
  // disco lunar + brazos de sombra
  ctx.save(); ctx.translate(MOON.x,MOON.y);
  ctx.fillStyle = G.eclipse>0?'#20182e':'#e8f0ff';
  ctx.beginPath(); ctx.arc(0,0,MOON.r,0,6.283); ctx.fill();
  ctx.strokeStyle='rgba(120,160,255,.7)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,MOON.r+5,0,6.283); ctx.stroke();
  for(const a of [G.moonA,G.moonB]){
    ctx.strokeStyle='rgba(80,110,190,.35)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*34,Math.sin(a)*34); ctx.stroke();
  }
  ctx.restore();
}
function drawGlow(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const s of SRC){
    const g = ctx.createRadialGradient(s.x,s.y,1,s.x,s.y,s.r);
    const warm = s.o.type==='mirror' ? '111,227,255' : '255,179,71';
    g.addColorStop(0,'rgba('+warm+',.30)'); g.addColorStop(1,'rgba('+warm+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
  }
  for(const b of G.beams){
    ctx.strokeStyle='rgba(255,240,190,.55)'; ctx.lineWidth=9;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
  }
  if(G.nova>0){ ctx.fillStyle='rgba(255,235,180,'+clamp(G.nova/3,0,1)*0.5+')'; ctx.fillRect(0,0,W,H); }
  ctx.restore();
}
function dimFor(x,y){ return clamp(0.38 + lightAt(x,y)*0.8, 0.38, 1); }

function drawTowers(){
  for(const t of G.towers){
    if(t.dead) continue;
    const l = lightAt(t.x,t.y,t);
    ctx.save(); ctx.translate(t.x,t.y);
    ctx.globalAlpha = t.type==='trap' ? 0.6 : clamp(0.58+l*0.6,0.58,1);
    const off = t.off || t.disabled;
    if(t===G.sel){ ctx.strokeStyle='#6fe3ff'; ctx.lineWidth=1; ctx.strokeRect(-19,-19,38,38); }
    switch(t.type){
      case 'torch': {
        ctx.fillStyle=off?'#3a3320':'#2a1f10'; ctx.fillRect(-7,-2,14,16);
        ctx.strokeStyle=off?'#5a5a5a':'#ffb347'; ctx.lineWidth=2; ctx.strokeRect(-7,-2,14,16);
        if(!off){ const f=4+Math.sin(G.t*11+t.x)*2;
          ctx.fillStyle='#ffdd88'; ctx.beginPath(); ctx.moveTo(0,-14-f); ctx.lineTo(7,-1); ctx.lineTo(-7,-1); ctx.closePath(); ctx.fill();
          ctx.fillStyle='#fff6d0'; ctx.beginPath(); ctx.arc(0,-6,3,0,6.283); ctx.fill(); }
        break; }
      case 'candle': {
        ctx.fillStyle=off?'#2b3040':'#3a2f1a'; ctx.fillRect(-8,0,16,12);
        ctx.strokeStyle=off?'#4a5468':'#c98f3a'; ctx.lineWidth=1.5; ctx.strokeRect(-8,0,16,12);
        if(!off){ ctx.fillStyle='#ffe9a8'; ctx.beginPath(); ctx.arc(0,-5,4+Math.sin(G.t*9+t.y)*1,0,6.283); ctx.fill(); }
        else { ctx.strokeStyle='#4a5468'; ctx.beginPath(); ctx.moveTo(-4,-6); ctx.lineTo(4,-2); ctx.stroke(); }
        break; }
      case 'beacon': {
        ctx.fillStyle='#101827'; ctx.beginPath(); ctx.arc(0,0,14,0,6.283); ctx.fill();
        ctx.strokeStyle=off?'#4a5468':'#fff0be'; ctx.lineWidth=2; ctx.stroke();
        ctx.rotate(t.ang);
        ctx.fillStyle=off?'#3a4256':'#ffe9a8';
        ctx.beginPath(); ctx.moveTo(4,-8); ctx.lineTo(20,-5); ctx.lineTo(20,5); ctx.lineTo(4,8); ctx.closePath(); ctx.fill();
        break; }
      case 'gargoyle': {
        const aw = t.awake;
        ctx.translate((t.gx||t.x)-t.x,(t.gy||t.y)-t.y);
        ctx.globalAlpha = clamp(0.55+l*0.7,0.55,1);
        ctx.fillStyle= aw?'#4b3a6b':'#6b7488';
        ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(14,6); ctx.lineTo(8,16); ctx.lineTo(-8,16); ctx.lineTo(-14,6); ctx.closePath(); ctx.fill();
        ctx.strokeStyle= aw?'#b07cff':'#98a4bd'; ctx.lineWidth=1.5; ctx.stroke();
        if(aw){ ctx.fillStyle='#ff5f6d'; ctx.fillRect(-6,-8,4,3); ctx.fillRect(2,-8,4,3);
          ctx.strokeStyle='rgba(176,124,255,.5)'; ctx.beginPath(); ctx.arc(0,0,t.def.range,0,6.283); ctx.stroke(); }
        else { ctx.fillStyle='#cfe0ff'; ctx.fillRect(-6,-8,4,3); ctx.fillRect(2,-8,4,3); }
        break; }
      case 'mirror': {
        ctx.rotate(t.ang);
        ctx.fillStyle='#0e1a26'; ctx.fillRect(-4,-16,8,32);
        ctx.strokeStyle='#6fe3ff'; ctx.lineWidth=2; ctx.strokeRect(-4,-16,8,32);
        ctx.fillStyle='rgba(111,227,255,.35)'; ctx.fillRect(-2,-14,4,28);
        break; }
      case 'trap': {
        ctx.strokeStyle='#b07cff'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.arc(0,0,11,0,6.283); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle='rgba(176,124,255,.35)'; ctx.beginPath(); ctx.arc(0,0,4,0,6.283); ctx.fill();
        break; }
    }
    if(t.flash>0){ ctx.globalAlpha=t.flash*4; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,16,0,6.283); ctx.fill(); }
    ctx.restore();
    if(t.hp<t.mhp && t.mhp<900){
      ctx.fillStyle='#000'; ctx.fillRect(t.x-13,t.y+19,26,3);
      ctx.fillStyle='#7dff9b'; ctx.fillRect(t.x-13,t.y+19,26*clamp(t.hp/t.mhp,0,1),3);
    }
    if(t.doused>0){ ctx.fillStyle='#ff5f6d'; ctx.font='9px monospace'; ctx.textAlign='center'; ctx.fillText('APAGADA',t.x,t.y-22); }
  }
}
function drawUnits(){
  for(const u of G.units){
    ctx.save(); ctx.translate(u.x,u.y);
    ctx.globalAlpha = 0.9;
    ctx.rotate(u.ang+Math.PI/2);
    ctx.fillStyle='#1a1030'; ctx.beginPath(); ctx.moveTo(0,-13); ctx.lineTo(9,9); ctx.lineTo(0,4); ctx.lineTo(-9,9); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#b07cff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#e0c8ff'; ctx.fillRect(-2,-9,4,4);
    ctx.restore();
    ctx.fillStyle='#000'; ctx.fillRect(u.x-11,u.y+13,22,3);
    ctx.fillStyle='#b07cff'; ctx.fillRect(u.x-11,u.y+13,22*clamp(u.hp/u.mhp,0,1),3);
  }
}
function drawEnemies(){
  for(const e of G.enemies){
    const l = lightAt(e.x,e.y);
    ctx.save(); ctx.translate(e.x,e.y);
    ctx.globalAlpha = e.type==='wraith' ? clamp(0.32+l*1.1,0.32,1) : clamp(0.62+l*0.5,0.62,1);
    if(e.type==='boss'){
      ctx.globalAlpha=1;
      const g=ctx.createRadialGradient(0,0,10,0,0,e.aura);
      g.addColorStop(0,'rgba(20,0,26,.85)'); g.addColorStop(1,'rgba(20,0,26,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,e.aura,0,6.283); ctx.fill();
      ctx.strokeStyle='rgba(255,95,109,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(0,0,e.aura,0,6.283); ctx.stroke();
    }
    ctx.fillStyle = e.hurtT>0 ? '#fff' : e.def.col;
    if(e.type==='moth'){
      const f=Math.sin(G.t*20+e.x)*6;
      ctx.beginPath(); ctx.ellipse(-8,0,7,4+f*0.3,0.5,0,6.283); ctx.fill();
      ctx.beginPath(); ctx.ellipse( 8,0,7,4-f*0.3,-0.5,0,6.283); ctx.fill();
      ctx.fillStyle='#8a6a2a'; ctx.beginPath(); ctx.arc(0,0,e.r*0.6,0,6.283); ctx.fill();
    } else if(e.type==='wraith'){
      ctx.beginPath(); ctx.moveTo(0,-e.r); ctx.quadraticCurveTo(e.r,0,0,e.r+4); ctx.quadraticCurveTo(-e.r,0,0,-e.r); ctx.fill();
      ctx.fillStyle='#fff'; ctx.fillRect(-4,-4,2,3); ctx.fillRect(2,-4,2,3);
    } else if(e.type==='golem'){
      ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);
      ctx.strokeStyle= l<DUSK ? '#b07cff' : '#3a4a66'; ctx.lineWidth=2; ctx.strokeRect(-e.r,-e.r,e.r*2,e.r*2);
      ctx.fillStyle='#ff5f6d'; ctx.fillRect(-7,-5,5,4); ctx.fillRect(3,-5,5,4);
      if(l<DUSK){ ctx.fillStyle='rgba(176,124,255,.25)'; ctx.fillRect(-e.r-3,-e.r-3,e.r*2+6,e.r*2+6); }
    } else {
      ctx.beginPath(); ctx.arc(0,0,e.r,0,6.283); ctx.fill();
      ctx.fillStyle='#1a0008';
      ctx.beginPath(); ctx.moveTo(-e.r,-e.r*0.2); ctx.lineTo(0,-e.r*1.5); ctx.lineTo(e.r,-e.r*0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff6a0'; ctx.beginPath(); ctx.arc(-9,-2,4,0,6.283); ctx.arc(9,-2,4,0,6.283); ctx.fill();
    }
    if(e.stun>0){ ctx.strokeStyle='#6fe3ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,e.r+6,0,6.283); ctx.stroke(); }
    if(e.burn>0){ ctx.fillStyle='rgba(255,180,80,.5)'; ctx.beginPath(); ctx.arc(0,0,e.r+4,0,6.283); ctx.fill(); }
    ctx.restore();
    const bw = e.type==='boss'?110:24;
    ctx.globalAlpha=1;
    ctx.fillStyle='#000'; ctx.fillRect(e.x-bw/2,e.y-e.r-9,bw,4);
    ctx.fillStyle= e.type==='boss'?'#ff5f6d':'#7dff9b'; ctx.fillRect(e.x-bw/2,e.y-e.r-9,bw*clamp(e.hp/e.mhp,0,1),4);
  }
}
function drawFx(){
  for(const f of G.fx){
    const k = 1-f.t/f.life;
    ctx.globalAlpha = k;
    if(f.k==='ring'){ ctx.strokeStyle=f.col; ctx.lineWidth=3*k+1; ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1-k*0.85),0,6.283); ctx.stroke(); }
    else if(f.k==='p'){ ctx.fillStyle=f.col; ctx.fillRect(f.x-2,f.y-2,4,4); }
    else { ctx.fillStyle=f.col; ctx.font='bold 11px "Courier New",monospace'; ctx.textAlign='center'; ctx.fillText(f.s,f.x,f.y); }
  }
  ctx.globalAlpha=1;
  for(const s of G.shots){ ctx.fillStyle=s.col; ctx.beginPath(); ctx.arc(s.x,s.y,3,0,6.283); ctx.fill(); }
}
function drawPreview(){
  const m=G.mouse;
  if(!G.build) return;
  const def = TOWERS[G.build]; if(!def) return;
  const x = def.unit ? m.x : m.cx*CELL+CELL/2, y = def.unit ? m.y : m.cy*CELL+CELL/2;
  const ok = def.unit ? true : cellFree(m.cx,m.cy);
  const afford = canPay(def.cost);
  ctx.save();
  ctx.globalAlpha=0.75;
  ctx.strokeStyle = (ok&&afford) ? '#7dff9b' : '#ff5f6d'; ctx.lineWidth=2;
  ctx.strokeRect(x-CELL/2+2,y-CELL/2+2,CELL-4,CELL-4);
  if(def.light){ ctx.strokeStyle='rgba(255,179,71,.5)'; ctx.setLineDash([4,5]); ctx.beginPath(); ctx.arc(x,y,def.light*lensMul(),0,6.283); ctx.stroke(); ctx.setLineDash([]); }
  if(def.range){ ctx.strokeStyle='rgba(111,227,255,.45)'; ctx.beginPath(); ctx.arc(x,y,def.range,0,6.283); ctx.stroke(); }
  ctx.globalAlpha=1; ctx.font='16px monospace'; ctx.textAlign='center'; ctx.fillStyle='#fff';
  ctx.fillText(def.icon,x,y+6);
  ctx.restore();
}
function drawHud(){
  if(G.banner>0){
    const a = clamp(G.banner,0,1);
    ctx.globalAlpha=a; ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,H/2-34,W,52);
    ctx.fillStyle= G.wave%5===0?'#ff5f6d':'#ffb347';
    ctx.font='bold 22px "Courier New",monospace';
    ctx.fillText(G.bannerTxt, W/2, H/2);
    ctx.globalAlpha=1;
  }
  if(G.eclipse>0){
    ctx.fillStyle='rgba(176,124,255,.9)'; ctx.font='bold 13px "Courier New",monospace'; ctx.textAlign='center';
    ctx.fillText('ECLIPSE TEMPORAL '+G.eclipse.toFixed(1)+'s', W/2, 24);
  }
  if(G.paused){
    ctx.fillStyle='rgba(3,4,10,.7)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffb347'; ctx.font='bold 26px "Courier New",monospace'; ctx.textAlign='center';
    ctx.fillText('PAUSA', W/2, H/2);
  }
  // leyenda de zona bajo el cursor
  const l = lightAt(G.mouse.x,G.mouse.y);
  if(G.mouse.x>0){
    ctx.textAlign='left'; ctx.font='10px "Courier New",monospace';
    ctx.fillStyle= l>=LIT?'#ffb347':(l>=DUSK?'#b07cff':'#5b6a8a');
    ctx.fillText(zoneOf(l), G.mouse.x+14, G.mouse.y-10);
  }
}
function render(){
  ctx.save();
  if(G.shake>0){ ctx.translate(rnd(-G.shake,G.shake), rnd(-G.shake,G.shake)); }
  drawGround();
  drawDarkness();
  drawPathHint();
  drawMoon();
  drawGlow();
  drawTowers();
  drawUnits();
  drawEnemies();
  drawCore();
  drawFx();
  drawPreview();
  ctx.restore();
  drawHud();
}

/* ============================ INTERFAZ ================================== */
const $ = id => document.getElementById(id);
function log(s){ G.msg.unshift(s); if(G.msg.length>6) G.msg.pop(); $('log').innerHTML = G.msg.map((m,i)=>'<div style="opacity:'+(1-i*0.15)+'">› '+m+'</div>').join(''); }

function buildShop(){
  const wrap = $('shop'); wrap.innerHTML='';
  const mk = (id,def,forge)=>{
    const b=document.createElement('button'); b.className='item'; b.dataset.id=id; b.dataset.forge=forge?'1':'';
    const c=def.cost;
    const cs=[]; if(c.oil)cs.push('<span class="c-oil">'+c.oil+' aceite</span>');
    if(c.ess)cs.push('<span class="c-ess">'+c.ess+' esencia</span>');
    if(c.cry)cs.push('<span class="c-cry">'+c.cry+' cristal'+(c.cry>1?'es':'')+'</span>');
    const up = def.oilUse ? '<span class="c-up"> · -'+def.oilUse.toFixed(2)+' aceite/s</span>' : '';
    b.innerHTML = '<div class="ico">'+def.icon+'</div><div style="flex:1">'+
      '<div class="nm"><span>'+def.name+'</span><span class="key">'+def.key+'</span></div>'+
      '<div class="ds">'+def.ds+'</div>'+
      '<div class="cost">'+cs.join(' + ')+up+'<span class="c-up" data-lv></span></div></div>';
    b.onclick = ()=> forge ? doForge(id) : selectBuild(id);
    wrap.appendChild(b);
  };
  for(const k in TOWERS) mk(k,TOWERS[k],false);
  const t=document.createElement('div'); t.className='ttl'; t.style.margin='4px -6px 6px'; t.textContent='Forja de cristales';
  wrap.appendChild(t);
  for(const k in FORGE) mk(k,FORGE[k],true);
}
function doForge(id){
  const f=FORGE[id];
  const lv = id==='lens'?G.lens:G.refin;
  if(lv>=f.cap){ log('Mejora al máximo.'); return; }
  if(!pay(f.cost)){ log('Faltan cristales para forjar.'); return; }
  if(id==='lens'){ G.lens++; log('<b>Lente mayor</b> forjada: alcance de luz +18%.'); }
  else { G.refin++; log('<b>Refinería</b> ampliada: +0.7 aceite/s.'); }
  fxRing(CORE.x,CORE.y,120,'#6fe3ff');
}
function selectBuild(id){
  G.build = (G.build===id) ? null : id;
  G.sel = null;
  syncShop();
}
function syncShop(){
  for(const b of document.querySelectorAll('.item')){
    const id=b.dataset.id, forge=b.dataset.forge==='1';
    const def = forge?FORGE[id]:TOWERS[id];
    b.classList.toggle('sel', !forge && G.build===id);
    let ok = canPay(def.cost);
    if(forge){
      const lv = id==='lens'?G.lens:G.refin;
      b.querySelector('[data-lv]').textContent = ' · NIVEL '+lv+'/'+def.cap;
      if(lv>=def.cap) ok=false;
    }
    b.classList.toggle('no', !ok);
  }
}
let uiT=0;
function updateUI(dt){
  uiT-=dt; if(uiT>0) return; uiT=0.09;
  $('r-oil').textContent = Math.floor(G.oil);
  $('r-oilrate').textContent = '('+(G.oilRate>=0?'+':'')+G.oilRate.toFixed(1)+'/s)';
  $('r-oilrate').style.color = G.oilRate>=0 ? '#7dff9b' : '#ff5f6d';
  $('r-ess').textContent = Math.floor(G.ess);
  $('r-cry').textContent = G.cry;
  $('r-core').textContent = Math.max(0,G.core);
  $('s-wave').textContent = G.wave;
  $('s-en').textContent = G.enemies.length + (G.spawnQ?G.spawnQ.length:0);
  $('s-kill').textContent = G.kills;
  $('s-ph').textContent = G.phase==='prep' ? 'PREP '+Math.max(0,G.prep).toFixed(0)+'s' : 'COMBATE';
  const lz = zoneOf(lightAt(G.mouse.x,G.mouse.y));
  $('s-lz').textContent = G.mouse.x<0 ? '-' : lz;
  for(let i=0;i<3;i++){
    const a=G.abil[i], el=$('ab'+i);
    $('cd'+i).style.height = (a.cd/a.max*100)+'%';
    el.classList.toggle('rdy', a.cd<=0);
  }
  $('bnext').textContent = G.phase==='prep' ? '▶ OLEADA '+(G.wave+1) : '⏱ EN COMBATE';
  $('bpause').textContent = G.paused ? '▶ SEGUIR' : 'PAUSA';
  syncShop();
  // panel de selección
  const s=$('sel');
  if(G.sel){
    const t=G.sel, l=lightAt(t.x,t.y,t), z=zoneOf(l);
    let extra='';
    if(t.type==='mirror') extra='Clic de nuevo para girar (+20°). Ángulo '+Math.round(t.ang*57.3)+'°.';
    else if(t.type==='candle') extra='Clic para '+(t.off?'encender':'apagar')+'. Estado: '+(t.off?'APAGADO':'ENCENDIDO')+'.';
    else if(t.type==='gargoyle') extra = t.awake?'DESPIERTA: devora a corta distancia.':'ESTATUA: invulnerable, frena a los invasores.';
    else if(t.disabled) extra='<span style="color:#ff5f6d">DESACTIVADA</span> (oscuridad, eclipse o sin aceite).';
    else extra = z==='LUZ' ? '<span style="color:#7dff9b">EN LA LUZ: +100% cadencia y precisión.</span>' : 'En penumbra: rendimiento normal.';
    s.innerHTML='<b>'+t.def.name+'</b> · zona '+z+'<br>'+extra+'<br>Pulsa V para vender (50%).';
  } else if(G.build){
    const d=TOWERS[G.build];
    s.innerHTML='<b>'+d.name+'</b><br>'+d.ds+'<br>Clic en el mapa para colocar · ESC para cancelar.';
  } else s.innerHTML='Selecciona una defensa o haz clic en una estructura del mapa.';
}

/* ============================ ENTRADA =================================== */
function toCanvas(ev){
  const r = cv.getBoundingClientRect();
  return { x:(ev.clientX-r.left)*(W/r.width), y:(ev.clientY-r.top)*(H/r.height) };
}
cv.addEventListener('mousemove', ev=>{
  const p=toCanvas(ev);
  G.mouse.x=p.x; G.mouse.y=p.y;
  G.mouse.cx=Math.floor(p.x/CELL); G.mouse.cy=Math.floor(p.y/CELL);
});
cv.addEventListener('mouseleave', ()=>{ G.mouse.x=-99; G.mouse.y=-99; G.mouse.cx=-1; G.mouse.cy=-1; });
cv.addEventListener('contextmenu', ev=>{ ev.preventDefault(); G.build=null; G.sel=null; syncShop(); });
cv.addEventListener('click', ev=>{
  if(G.over) return;
  const p=toCanvas(ev);
  const cx=Math.floor(p.x/CELL), cy=Math.floor(p.y/CELL);
  if(G.build){ placeTower(G.build,cx,cy); syncShop(); return; }
  let hit=null;
  for(const t of G.towers){ if(!t.dead && dist(p.x,p.y,t.x,t.y)<22) hit=t; }
  if(hit){
    if(G.sel===hit){
      if(hit.type==='mirror'){ hit.ang += 0.349; fxSpark(hit.x,hit.y,'#6fe3ff',4); }
      else if(hit.type==='candle'){ hit.off=!hit.off; fxSpark(hit.x,hit.y,hit.off?'#5b6a8a':'#ffb347',5); }
      else if(hit.type==='beacon'){ hit.off=!hit.off; }
    }
    G.sel = hit;
  } else G.sel = null;
});
function sell(){
  const t=G.sel; if(!t) return;
  G.oil += Math.floor(t.spent.oil*0.5); G.ess += Math.floor(t.spent.ess*0.5); G.cry += Math.floor(t.spent.cry*0.5);
  t.dead=true; GRID[t.cy][t.cx]=0; fxRing(t.x,t.y,34,'#5b6a8a');
  log('Estructura desmantelada (50% reembolsado).');
  G.sel=null;
}
addEventListener('keydown', ev=>{
  const k = ev.key.toLowerCase();
  for(const id in TOWERS) if(TOWERS[id].key===k){ selectBuild(id); return; }
  for(const id in FORGE)  if(FORGE[id].key===k){ doForge(id); return; }
  if(k==='q') useAbility(0);
  else if(k==='w') useAbility(1);
  else if(k==='e') useAbility(2);
  else if(k==='escape'){ G.build=null; G.sel=null; syncShop(); }
  else if(k==='v') sell();
  else if(k==='p') G.paused=!G.paused;
  else if(k===' '){ ev.preventDefault(); startWave(); }
});
$('bnext').onclick  = ()=> startWave();
$('bsell').onclick  = ()=> sell();
$('bpause').onclick = ()=>{ G.paused=!G.paused; };
$('ab0').onclick = ()=>useAbility(0);
$('ab1').onclick = ()=>useAbility(1);
$('ab2').onclick = ()=>useAbility(2);
$('ovb').onclick = ()=>{ $('ov').classList.remove('on'); newGame(); buildShop(); };

function endGame(won){
  if(G.over) return;
  G.over=true; G.won=won; G.paused=true;
  $('ovt').textContent = won ? 'EL CASTILLO RESISTE' : 'EL CASTILLO HA CAÍDO';
  $('ovt').style.color = won ? '#7dff9b' : '#ff5f6d';
  $('ovp').innerHTML = 'Oleadas superadas: <b>'+(won?G.wave:G.wave-1)+'</b><br>Invasores destruidos: <b>'+G.kills+'</b><br>Cristales de Prisma: <b>'+G.cry+'</b>';
  $('ov').classList.add('on');
}

/* ============================ BUCLE ===================================== */
let last = performance.now();
function loop(now){
  let dt = (now-last)/1000; last=now;
  dt = Math.min(dt, 0.05);
  if(!G.paused && !G.over){
    G.t += dt;
    G.moonA += 0.23*dt; G.moonB -= 0.37*dt;
    if(G.eclipse>0) G.eclipse-=dt;
    if(G.nova>0) G.nova-=dt;
    for(const a of G.abil) if(a.cd>0) a.cd-=dt;
    if(G.banner>0) G.banner-=dt;
    if(G.shake>0) G.shake=Math.max(0,G.shake-dt*22);
    refreshSources();
    computeBeams();
    updateTowers(dt);
    beamDamage(dt);
    updateEnemies(dt);
    updateUnits(dt);
    updateShots(dt);
    updateFx(dt);
    updateWave(dt);
  } else { refreshSources(); computeBeams(); }
  render();
  updateUI(dt);
  requestAnimationFrame(loop);
}
newGame();
buildShop();
requestAnimationFrame(loop);
</script>
</body>
</html>
